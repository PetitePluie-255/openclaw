name: Build macOS App (Intel x86_64)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build OpenClaw (x86_64)
    # Use macOS 15, which has newer Xcode versions available (Xcode 16+)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Select Xcode 26.3 / 26.1 (Swift 6.2)
        # Apple skipped versions to align macOS and iOS numbers; Xcode is now version 26.x
        # OpenClaw explicitly requires Swift 6.2
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('apps/macos/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Cache Swift Build Object Cache
        uses: actions/cache@v4
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-build-x86-${{ hashFiles('apps/macos/Package.resolved') }}-${{ hashFiles('apps/macos/Sources/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-build-x86-${{ hashFiles('apps/macos/Package.resolved') }}-
            ${{ runner.os }}-build-x86-

      - name: Patch project Package.swift files for macOS 13
        run: |
          sed -i '' 's/\.macOS(\.v15)/\.macOS(\.v13)/g' apps/macos/Package.swift
          sed -i '' 's/\.macOS(\.v15)/\.macOS(\.v13)/g' apps/shared/OpenClawKit/Package.swift
          sed -i '' 's/\.macOS(\.v15)/\.macOS(\.v13)/g' Swabble/Package.swift
          sed -i '' 's/15\.0/13\.0/g' apps/macos/Sources/OpenClaw/Resources/Info.plist

          echo "✓ Project Package.swift files patched to macOS 13"

      - name: Resolve dependencies and patch checkouts for macOS 13
        working-directory: apps/macos
        run: |
          # Resolve into the same --build-path that package-mac-app.sh uses
          # for x86_64 builds, so the patched checkouts are the ones actually
          # compiled.
          swift package resolve --build-path .build/x86_64

          CHECKOUT_ROOTS=(
            ".build/x86_64/checkouts"
            ".build/x86_64/SourcePackages/checkouts"
          )

          FAILED=0
          patch_dep() {
            local dep="$1"
            local found=0
            for root in "${CHECKOUT_ROOTS[@]}"; do
              local pkg="$root/$dep/Package.swift"
              if [ -f "$pkg" ]; then
                sed -i '' \
                  -e 's/\.macOS(\.v14)/\.macOS(\.v13)/g' \
                  -e 's/\.macOS(\.v15)/\.macOS(\.v13)/g' \
                  "$pkg"
                echo "  ✓ Patched $dep at $root"
                found=1
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "  ✗ MISSING: $dep (searched in ${CHECKOUT_ROOTS[*]})"
              FAILED=1
            fi
          }

          # Patch direct and transitive dependencies that declare macOS 14/15.
          for dep in peekaboo commander textual elevenlabskit swiftui-math axorcist; do
            patch_dep "$dep"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more dependency checkouts not found. Listing checkouts:"
            for root in "${CHECKOUT_ROOTS[@]}"; do
              echo "-- $root"
              ls -1 "$root" 2>/dev/null || echo "(directory not found)"
            done
            exit 1
          fi

      - name: Build Mac App
        env:
          ALLOW_ADHOC_SIGNING: 1
          BUILD_CONFIG: release
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          echo "Building architectures: x86_64"
          chmod +x scripts/package-mac-app.sh
          chmod +x scripts/codesign-mac-app.sh
          BUILD_ARCHS="x86_64" ./scripts/package-mac-app.sh

      - name: Compress App Bundle
        # `actions/upload-artifact` can lose macOS symlinks/executable permissions if uploading a directory.
        # It's safest to zip the `.app` bundle explicitly before uploading.
        run: |
          cd dist
          zip -ry OpenClaw-macOS-x86_64.zip OpenClaw.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-macOS-x86_64
          path: dist/OpenClaw-macOS-x86_64.zip
          retention-days: 7
