name: Build macOS App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture to build"
        required: true
        type: choice
        default: "Universal (arm64 x86_64)"
        options:
          - "Universal (arm64 x86_64)"
          - "Apple Silicon (arm64)"
          - "Intel (x86_64)"

jobs:
  build:
    name: Build OpenClaw for macOS
    # Use macOS 15, which has newer Xcode versions available (Xcode 16+)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Select Xcode 26.3 / 26.1 (Swift 6.2)
        # Apple skipped versions to align macOS and iOS numbers; Xcode is now version 26.x
        # OpenClaw explicitly requires Swift 6.2
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_26.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('apps/macos/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Cache Swift Build Object Cache
        uses: actions/cache@v4
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-swift-build-${{ hashFiles('apps/macos/Package.resolved') }}-${{ hashFiles('apps/macos/Sources/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-build-${{ hashFiles('apps/macos/Package.resolved') }}-
            ${{ runner.os }}-swift-build-

      - name: Build Mac App
        env:
          # CI environments usually don't have Apple Developer certificates configured.
          # ALLOW_ADHOC_SIGNING=1 allows the script to fallback to ad-hoc ("-") signing,
          # avoiding build failure due to missing certificates.
          ALLOW_ADHOC_SIGNING: 1
          # Release config creates Universal Binary (arm64 x86_64) by default
          BUILD_CONFIG: release
        run: |
          CHOSEN_ARCH="${{ github.event.inputs.arch }}"

          if [[ "$CHOSEN_ARCH" == "Apple Silicon (arm64)" ]]; then
             export BUILD_ARCHS="arm64"
          elif [[ "$CHOSEN_ARCH" == "Intel (x86_64)" ]]; then
             export BUILD_ARCHS="x86_64"
          else
             # Default fallback (Universal) or push/PR event trigger
             export BUILD_ARCHS="arm64 x86_64"
          fi

          echo "Building architectures: $BUILD_ARCHS"

          chmod +x scripts/package-mac-app.sh
          chmod +x scripts/codesign-mac-app.sh
          ./scripts/package-mac-app.sh

      - name: Compress App Bundle
        # `actions/upload-artifact` can lose macOS symlinks/executable permissions if uploading a directory.
        # It's safest to zip the `.app` bundle explicitly before uploading.
        run: |
          cd dist
          zip -ry OpenClaw-macOS.zip OpenClaw.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-macOS-App
          path: dist/OpenClaw-macOS.zip
          retention-days: 7
